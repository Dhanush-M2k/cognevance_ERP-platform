<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inventory | Enterprise ERP Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: sidebar('inventory')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments :: topbar('Inventory Management','Track stock levels, suppliers and reorder points')}"></div>
        <div class="content">

            <div class="panel">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">Add New Item</div>
                        <div class="panel-subtitle">Create a new inventory record</div>
                    </div>
                </div>
                <form th:action="@{/inventory}" th:object="${newItem}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Name</label>
                            <input class="form-control" type="text" th:field="*{itemName}" required/>
                        </div>
                        <div class="form-group">
                            <label>SKU</label>
                            <input class="form-control" type="text" th:field="*{sku}" placeholder="SKU-XXXX"/>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input class="form-control" type="text" th:field="*{category}"/>
                        </div>
                        <div class="form-group">
                            <label>Supplier</label>
                            <input class="form-control" type="text" th:field="*{supplier}"/>
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input class="form-control" type="number" th:field="*{quantity}" required/>
                        </div>
                        <div class="form-group">
                            <label>Reorder Level</label>
                            <input class="form-control" type="number" th:field="*{reorderLevel}"/>
                        </div>
                        <div class="form-group">
                            <label>Unit Price (₹)</label>
                            <input class="form-control" type="number" step="0.01" th:field="*{unitPrice}"/>
                        </div>
                    </div>
                    <div style="margin-top:16px;">
                        <button type="submit" class="btn btn-primary">Add Item</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">All Inventory Items</div>
                        <div class="panel-subtitle" th:text="${#lists.size(items)} + ' items tracked'">0 items</div>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr><th>Item</th><th>SKU</th><th>Category</th><th>Qty</th><th>Reorder Lvl</th><th>Unit Price</th><th>Supplier</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${items}">
                            <td th:text="${item.itemName}">Item</td>
                            <td th:text="${item.sku}">SKU</td>
                            <td th:text="${item.category}">Category</td>
                            <td>
                                <span class="badge" th:classappend="${item.lowStock} ? 'badge-terminated' : 'badge-active'" th:text="${item.quantity}">0</span>
                            </td>
                            <td th:text="${item.reorderLevel}">0</td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')}">₹0</td>
                            <td th:text="${item.supplier}">Supplier</td>
                            <td>
                                <div class="row-actions">
                                    <form th:action="@{/inventory/{id}/delete(id=${item.id})}" method="post">
                                        <button type="submit" class="icon-btn" title="Delete">&#10005;</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="empty-state">No inventory items yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
