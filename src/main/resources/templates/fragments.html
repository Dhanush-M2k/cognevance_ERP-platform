<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-badge">EP</div>
        <span>ERP Platform</span>
    </div>
    <nav class="sidebar-nav">
        <div class="sidebar-section-title">Overview</div>
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="nav-icon">&#128202;</span> Dashboard
        </a>
        <a th:href="@{/monitoring}" th:classappend="${active == 'monitoring'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <span class="nav-icon">&#128225;</span> Live Monitoring
        </a>

        <div class="sidebar-section-title" sec:authorize="hasAnyRole('ADMIN','MANAGER','EMPLOYEE')">Operations</div>
        <a th:href="@{/employees}" th:classappend="${active == 'employees'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <span class="nav-icon">&#128101;</span> Employees
        </a>
        <a th:href="@{/inventory}" th:classappend="${active == 'inventory'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','MANAGER','EMPLOYEE')">
            <span class="nav-icon">&#128230;</span> Inventory
        </a>
        <a th:href="@{/sales}" th:classappend="${active == 'sales'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','MANAGER','EMPLOYEE')">
            <span class="nav-icon">&#128181;</span> Sales
        </a>
        <a th:href="@{/finance}" th:classappend="${active == 'finance'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <span class="nav-icon">&#128176;</span> Finance
        </a>
		<a th:href="@{/purchases}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
		    <span class="nav-icon">&#128722;</span> Purchases
		</a>

        <div class="sidebar-section-title">Customer</div>
        <a th:href="@{/feedback}" th:classappend="${active == 'feedback'} ? 'active'">
            <span class="nav-icon">&#11088;</span> Feedback &amp; Reviews
        </a>
    </nav>
    <div class="sidebar-footer">
        Enterprise ERP Platform<br/>v1.0.0 &middot; Spring Boot
    </div>
</div>

<div th:fragment="topbar(title, subtitle)" class="topbar">
    <div>
        <div class="topbar-title" th:text="${title}">Page Title</div>
        <div class="topbar-subtitle" th:text="${subtitle}">Page subtitle</div>
    </div>
    <div class="topbar-right">
        <div class="user-chip">
            <div class="user-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div>
            <div>
                <div style="font-size:13px; font-weight:700;" th:text="${#authentication.name}">username</div>
                <div class="user-role" th:text="${#authentication.authorities}">ROLE</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</div>

</body>
</html>
